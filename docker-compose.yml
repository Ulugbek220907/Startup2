# Local development and demo: everything with mock integrations, no API keys.
#
#   docker compose up --build
#
# then open http://localhost:8080 (app) and http://localhost:8080/admin/
# (admin / admin-dev-password). MinIO console: http://localhost:9001.
# These credentials are for local use only; production uses
# deploy/docker-compose.prod.yml with values from a private .env file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qiyiq
      POSTGRES_PASSWORD: qiyiq-dev
      POSTGRES_DB: qiyiq
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiyiq -d qiyiq"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage for development. MinIO no longer publishes its
  # own image on Docker Hub; this is the Chainguard build of the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: qiyiq-dev
      MINIO_ROOT_PASSWORD: qiyiq-dev-secret
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"

  # Creates the bucket once, then exits. In MinIO's single-disk mode a
  # bucket is a top-level folder, so no client tool is needed. (Reuses the
  # Postgres image only because it is already downloaded and has a shell.)
  minio-init:
    image: postgres:16-alpine
    user: root
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/qiyiq && chown -R 65532:65532 /data"]
    volumes:
      - minio-data:/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://qiyiq:qiyiq-dev@db:5432/qiyiq
      PUBLIC_BASE_URL: http://localhost:8080
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: qiyiq
      S3_ACCESS_KEY: qiyiq-dev
      S3_SECRET_KEY: qiyiq-dev-secret
      S3_PATH_STYLE: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-dev-password
      SEED_DEMO: "true"
      LOG_FORMAT: pretty
      # Mock integrations are the defaults; listed here to make that visible.
      TRYON_PROVIDER: mock
      MODERATION_MOCK_MODE: allow_all
    ports:
      - "8080:8080"

volumes:
  db-data:
  minio-data:
