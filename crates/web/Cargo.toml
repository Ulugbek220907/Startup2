[package]
name = "web"
description = "Customer web app and admin page (Leptos, compiled to WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/bin/app.rs"

[[bin]]
name = "admin"
path = "src/bin/admin.rs"

[dependencies]
design.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3.107"
features = [
    "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "CanvasWindingRule", "Clipboard", "Crypto", "CssStyleDeclaration",
    "Document", "DomRect", "Element", "Event", "EventTarget", "File", "FileList", "Headers", "History",
    "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "HtmlImageElement", "HtmlInputElement",
    "HtmlSelectElement", "HtmlTextAreaElement", "HtmlVideoElement", "ImageData", "KeyboardEvent", "Location",
    "MediaStream", "Navigator", "Performance", "PointerEvent", "Request", "RequestCredentials", "RequestInit", "RequestMode",
    "Response", "Storage", "Url", "WebGlBuffer", "WebGlProgram", "WebGlRenderingContext", "WebGlShader",
    "WebGlTexture", "WebGlUniformLocation", "Window", "console",
]
