[package]
name = "renderer"
description = "Deterministic server-side rendering: garment mockups, 300-DPI print files, production sheets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
design = { workspace = true, features = ["embed-fonts"] }
domain.workspace = true
thiserror.workspace = true
# resvg re-exports the exact tiny-skia and usvg versions it was built with;
# we use those re-exports so the three can never drift apart.
resvg = { version = "0.49", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "6.1"
png = "0.18"
miniz_oxide = "0.9"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
serde_json.workspace = true
