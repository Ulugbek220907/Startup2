name: Deploy

# Builds the server image, pushes it to the GitHub Container Registry and
# rolls it out on the VPS. Runs on version tags, or manually.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Never run two deployments at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          # Image names must be lower-case.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag="sha-${GITHUB_SHA::12}"
          echo "image=ghcr.io/$repo:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    needs: image
    runs-on: ubuntu-24.04
    # Approvals and the VPS secrets can be attached to this environment.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy the compose file and Caddy config to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: /opt/qiyiqdoppi
          strip_components: 1
      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/qiyiqdoppi
            test -f .env || { echo ".env is missing on the server (see docs/DEPLOY.md)"; exit 1; }
            # Record which image is running; everything else in .env stays.
            grep -v '^APP_IMAGE=' .env > .env.next && echo "APP_IMAGE=$APP_IMAGE" >> .env.next && mv .env.next .env
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env pull app
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker logout ghcr.io
            # Wait until the new container reports healthy (migrations run at start).
            for i in $(seq 1 40); do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f docker-compose.prod.yml ps -q app)" 2>/dev/null || true)"
              [ "$state" = "healthy" ] && { echo "deployed $APP_IMAGE"; exit 0; }
              sleep 3
            done
            echo "the app did not become healthy; recent logs:"
            docker compose -f docker-compose.prod.yml logs --tail 50 app
            exit 1
